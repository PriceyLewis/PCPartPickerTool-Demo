name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile and package
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload runnable demo JAR
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pc-part-picker-demo
          path: target/pc-part-picker-demo.jar
          if-no-files-found: error
